<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hero SMS — Cek Harga</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080810;--surface:#0f0f1e;--surface2:#161628;--surface3:#1e1e36;
  --green:#00ff88;--cyan:#00d4ff;--yellow:#ffcc00;--red:#ff4455;--purple:#a855f7;
  --text:#f0f0ff;--muted:#4a4a70;--border:rgba(255,255,255,0.06);--border-bright:rgba(255,255,255,0.12);
  --r:14px;--r-sm:8px;
}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(0,255,136,0.06) 0%,transparent 60%),
  radial-gradient(ellipse 60% 40% at 80% 80%,rgba(0,212,255,0.04) 0%,transparent 50%);}
.app{max-width:1100px;margin:0 auto;padding:24px 16px}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding:14px 20px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);}
.logo{display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:1rem}
.logo-dot{width:9px;height:9px;background:var(--green);border-radius:50%;box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.back-btn{background:var(--surface2);border:1px solid var(--border-bright);color:var(--muted);
  padding:7px 14px;border-radius:var(--r-sm);font-family:'JetBrains Mono',monospace;font-size:0.78rem;cursor:pointer;text-decoration:none;transition:all .2s}
.back-btn:hover{border-color:var(--cyan);color:var(--cyan)}

/* CONTROLS */
.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-bottom:12px;align-items:end}
.ctrl-group label{display:block;font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--muted);
  margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
input,select{width:100%;background:var(--surface2);border:1px solid var(--border-bright);color:var(--text);
  padding:9px 13px;border-radius:var(--r-sm);font-family:'JetBrains Mono',monospace;font-size:0.83rem;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--cyan)}
select option{background:var(--surface2)}

/* BUTTONS */
.btn-fetch{background:linear-gradient(135deg,var(--green),var(--cyan));color:#080810;border:none;
  padding:9px 24px;border-radius:var(--r-sm);font-family:'Syne',sans-serif;font-weight:800;font-size:0.9rem;
  cursor:pointer;transition:opacity .2s,transform .1s;white-space:nowrap;height:40px}
.btn-fetch:hover{opacity:.85}.btn-fetch:active{transform:scale(.97)}.btn-fetch:disabled{opacity:.4;cursor:not-allowed}
.btn-sm{background:transparent;border:1px solid var(--border-bright);color:var(--muted);
  padding:6px 13px;border-radius:var(--r-sm);font-family:'JetBrains Mono',monospace;font-size:0.73rem;cursor:pointer;white-space:nowrap;transition:all .2s}
.btn-sm:hover{border-color:var(--cyan);color:var(--cyan)}
.btn-sm.active{background:rgba(0,255,136,0.12);border-color:var(--green);color:var(--green)}

/* IDR RATE BAR */
.rate-bar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:10px 14px;margin-bottom:14px;flex-wrap:wrap}
.rate-bar label{font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.rate-bar input{width:130px;flex-shrink:0}
.rate-info{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--text);flex:1;min-width:140px}
.rate-info span{color:var(--green)}

/* FILTER BAR */
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-bar input{flex:1;min-width:160px}
.filter-bar select{width:160px}

/* SUMMARY */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px}
.card-label{font-family:'JetBrains Mono',monospace;font-size:0.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.card-value{font-size:1.25rem;font-weight:800;color:var(--cyan)}

/* TABLE */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead{background:#0a0a18}
th{padding:9px 13px;text-align:left;font-family:'JetBrains Mono',monospace;font-size:0.66rem;
  color:var(--muted);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--cyan)}
th.active-sort{color:var(--cyan)}
td{padding:8px 13px;font-family:'JetBrains Mono',monospace;font-size:0.78rem;border-bottom:1px solid rgba(255,255,255,0.025)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.02)}

.td-service{color:var(--cyan);font-weight:700}
.td-name{color:var(--text);font-size:0.74rem;color:var(--muted)}
.td-country{color:var(--yellow)}
.td-usd{color:var(--green);font-weight:700}
.td-idr{color:var(--purple);font-weight:700}
.td-count{color:var(--text)}
.td-physical{color:var(--muted);font-size:0.72rem}

/* LOADER */
.loader-wrap{padding:3rem;text-align:center}
.spinner-big{width:34px;height:34px;border:2px solid var(--border-bright);border-top-color:var(--green);
  border-radius:50%;animation:spin .7s linear infinite;margin:1rem auto 0}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-family:'JetBrains Mono',monospace;color:var(--green);font-size:0.83rem}
.empty{padding:3rem;text-align:center;font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:0.83rem}
.error-box{background:rgba(255,68,85,0.08);border:1px solid rgba(255,68,85,0.25);border-radius:var(--r-sm);
  padding:11px 15px;color:var(--red);font-family:'JetBrains Mono',monospace;font-size:0.78rem;margin-bottom:14px}

/* PAGINATION */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
  border-top:1px solid var(--border);flex-wrap:wrap;gap:8px}
.page-btns{display:flex;gap:5px;flex-wrap:wrap}
.page-btn{background:var(--surface2);border:1px solid var(--border-bright);color:var(--text);
  padding:5px 11px;border-radius:var(--r-sm);cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:0.71rem;transition:all .2s}
.page-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.page-btn.active{background:rgba(0,212,255,0.12);border-color:var(--cyan);color:var(--cyan);font-weight:700}
.page-btn:disabled{opacity:.3;cursor:not-allowed}
.page-info{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--muted)}

@media(max-width:640px){
  .controls{grid-template-columns:1fr 1fr}
  .btn-fetch{grid-column:span 2;width:100%}
  .summary{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo"><div class="logo-dot"></div>Hero SMS · Cek Harga</div>
    <a href="index.html" class="back-btn">← Kembali</a>
  </header>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="ctrl-group">
      <label>Filter Country</label>
      <select id="countrySelect" onchange="onCountryChange()">
        <option value="">⏳ Memuat countries...</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label>Filter Service</label>
      <select id="serviceSelect">
        <option value="">Semua Service</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label>&nbsp;</label>
      <button class="btn-fetch" id="fetchBtn" onclick="fetchPrices()">Get Harga</button>
    </div>
  </div>

  <div id="errorArea"></div>
  <div id="summaryArea"></div>

  <!-- FILTER BAR -->
  <div class="filter-bar" id="filterBar" style="display:none">
    <input type="text" id="searchBox" placeholder="Cari service / nama / country..." oninput="applyFilter()">
    <select id="sortBy" onchange="applyFilter()" style="width:170px">
      <option value="">Sort default</option>
      <option value="price_asc">Harga ↑ Termurah</option>
      <option value="price_desc">Harga ↓ Termahal</option>
      <option value="count_desc">Stok ↓ Terbanyak</option>
      <option value="service_asc">Service A-Z</option>
      <option value="country_asc">Country ID ↑</option>
    </select>
    <span id="statusText" style="font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--muted);margin-left:auto"></span>
    <button class="btn-sm" onclick="exportCSV()">⬇ CSV</button>
  </div>

  <!-- TABLE -->
  <div class="table-wrap" id="tableWrap" style="display:none">
    <div id="tableBody"></div>
    <div class="pagination" id="pagination"></div>
  </div>

</div>

<script>
// ─── CONSTANTS ───────────────────────────────────────────────────
const API = '/api/herosms';
let allRows = [], filtered = [], page = 1, PER_PAGE = 100;
let sortCol = '', sortDir = 1;
// Harga dari backend sudah IDR (coin × 27000 × 1.3), tidak perlu konversi lagi

// ─── INIT ─────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  await Promise.all([loadCountries(), loadServices()]);
});

async function apiFetch(params) {
  const q = new URLSearchParams(params).toString();
  const r = await fetch(`${API}?${q}`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// ─── LOAD COUNTRIES (otomatis dari API) ──────────────────────────
async function loadCountries() {
  const sel = document.getElementById('countrySelect');
  try {
    const data = await apiFetch({ action: 'countries' });
    sel.innerHTML = '<option value="">Semua Country</option>';
    (Array.isArray(data) ? data : []).forEach(c => {
      const o = document.createElement('option');
      o.value = c.id;
      o.textContent = `${c.id} — ${c.name}`;
      if (c.id === '6') o.selected = true;
      sel.appendChild(o);
    });
  } catch(e) {
    sel.innerHTML = `<option value="">Semua Country</option>
      <option value="6" selected>6 — Indonesia 🇮🇩</option>
      <option value="0">0 — Russia 🇷🇺</option>
      <option value="187">187 — USA 🇺🇸</option>
      <option value="22">22 — Philippines 🇵🇭</option>
      <option value="14">14 — India 🇮🇳</option>
      <option value="55">55 — Malaysia 🇲🇾</option>
      <option value="44">44 — Thailand 🇹🇭</option>
      <option value="132">132 — Vietnam 🇻🇳</option>
      <option value="7">7 — Kazakhstan 🇰🇿</option>`;
  }
}

// ─── LOAD SERVICES (otomatis dari API) ───────────────────────────
async function loadServices() {
  const sel = document.getElementById('serviceSelect');
  try {
    const data = await apiFetch({ action: 'services' });
    sel.innerHTML = '<option value="">Semua Service</option>';
    (Array.isArray(data) ? data : []).forEach(s => {
      const code = s.code || s.service || s.id || s;
      const name = s.name || code;
      const o = document.createElement('option');
      o.value = code;
      o.textContent = `${code} — ${name}`;
      sel.appendChild(o);
    });
  } catch(e) {
    // biarkan hanya "Semua Service"
  }
}

function onCountryChange() {
  // bisa auto-fetch saat country berubah
}

// ─── FETCH PRICES ────────────────────────────────────────────────
async function fetchPrices() {
  const btn = document.getElementById('fetchBtn');
  btn.disabled = true; btn.textContent = 'Loading...';
  document.getElementById('errorArea').innerHTML = '';
  document.getElementById('summaryArea').innerHTML = '';
  document.getElementById('filterBar').style.display = 'none';
  document.getElementById('tableWrap').style.display = 'none';

  const country = document.getElementById('countrySelect').value;
  const service = document.getElementById('serviceSelect').value;

  const params = { action: 'getPrices' };
  if (country) params.country = country;
  if (service) params.service = service;

  showLoader();

  try {
    const data = await apiFetch(params);

    // Parse: { country: { service: { cost, count, physicalCount } } }
    // atau:  { service: { country: { cost, count, physicalCount } } }
    allRows = [];

    const keys = Object.keys(data);
    if (keys.length === 0) throw new Error('Data kosong dari API');

    // Deteksi format: cek apakah key pertama berisi object dengan key numerik (country-first) atau bukan
    const firstVal = data[keys[0]];
    const firstInner = firstVal ? Object.values(firstVal)[0] : null;

    let isCountryFirst = false;
    if (firstInner && typeof firstInner === 'object' && ('cost' in firstInner || 'count' in firstInner)) {
      // format: country → service → {cost, count}
      isCountryFirst = true;
    }

    if (isCountryFirst) {
      for (const [cid, services] of Object.entries(data)) {
        for (const [svc, info] of Object.entries(services)) {
          allRows.push({
            country: cid,
            service: svc,
            price: parseFloat(info.cost) || 0,
            count: parseInt(info.count) || 0,
            physical: parseInt(info.physicalCount) || 0,
          });
        }
      }
    } else {
      // format: service → country → {cost, count}
      for (const [svc, countries] of Object.entries(data)) {
        if (typeof countries !== 'object') continue;
        for (const [cid, info] of Object.entries(countries)) {
          allRows.push({
            country: cid,
            service: svc,
            price: parseFloat(info.cost) || 0,
            count: parseInt(info.count) || 0,
            physical: parseInt(info.physicalCount) || 0,
          });
        }
      }
    }

    if (allRows.length === 0) {
      hideLoader();
      showError('Tidak ada data. Coba ubah filter.');
      btn.disabled = false; btn.textContent = 'Get Harga';
      return;
    }

    renderSummary();
    page = 1;
    applyFilter();
    document.getElementById('filterBar').style.display = 'flex';
    document.getElementById('tableWrap').style.display = 'block';
    document.getElementById('statusText').textContent =
      `${allRows.length.toLocaleString()} data · ${new Date().toLocaleTimeString('id-ID')}`;

  } catch(e) {
    hideLoader();
    showError(`Gagal: ${e.message}`);
  }

  btn.disabled = false; btn.textContent = 'Get Harga';
}

function showLoader() {
  document.getElementById('tableBody').innerHTML =
    `<div class="loader-wrap"><div class="loader-text">Mengambil data harga dari Hero SMS...</div><div class="spinner-big"></div></div>`;
  document.getElementById('tableWrap').style.display = 'block';
}
function hideLoader() {
  document.getElementById('tableBody').innerHTML = '';
  document.getElementById('tableWrap').style.display = 'none';
}

// ─── SUMMARY ─────────────────────────────────────────────────────
function renderSummary() {
  const services = new Set(allRows.map(r => r.service)).size;
  const countries = new Set(allRows.map(r => r.country)).size;
  const prices = allRows.map(r => r.price).filter(p => p > 0);
  const minIDR = prices.length ? Math.min(...prices) : 0;
  const maxIDR = prices.length ? Math.max(...prices) : 0;

  document.getElementById('summaryArea').innerHTML = `
    <div class="summary">
      <div class="card"><div class="card-label">Total Data</div><div class="card-value">${allRows.length.toLocaleString()}</div></div>
      <div class="card"><div class="card-label">Service</div><div class="card-value">${services}</div></div>
      <div class="card"><div class="card-label">Country</div><div class="card-value">${countries}</div></div>
      <div class="card"><div class="card-label">Harga Min</div><div class="card-value" style="color:var(--green)">Rp ${minIDR.toLocaleString('id-ID')}</div></div>
      <div class="card"><div class="card-label">Harga Max</div><div class="card-value" style="color:var(--yellow)">Rp ${maxIDR.toLocaleString('id-ID')}</div></div>
    </div>`;
}

// ─── FILTER & SORT ───────────────────────────────────────────────
function applyFilter() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const sort = document.getElementById('sortBy').value;

  filtered = allRows.filter(r =>
    r.service.toLowerCase().includes(q) ||
    r.country.toLowerCase().includes(q)
  );

  if (sort === 'price_asc')        filtered.sort((a,b) => a.price - b.price);
  else if (sort === 'price_desc')  filtered.sort((a,b) => b.price - a.price);
  else if (sort === 'count_desc')  filtered.sort((a,b) => b.count - a.count);
  else if (sort === 'service_asc') filtered.sort((a,b) => a.service.localeCompare(b.service));
  else if (sort === 'country_asc') filtered.sort((a,b) => parseInt(a.country)-parseInt(b.country));

  page = 1;
  renderTable();
}

// ─── RENDER TABLE ────────────────────────────────────────────────
function renderTable() {
  const start = (page - 1) * PER_PAGE;
  const slice = filtered.slice(start, start + PER_PAGE);

  const rows = slice.map(r => {
    return `<tr>
      <td class="td-service">${r.service}</td>
      <td class="td-country">${r.country}</td>
      <td class="td-idr">Rp ${r.price.toLocaleString('id-ID')}</td>
      <td class="td-count">${r.count.toLocaleString()}</td>
      <td class="td-physical">${r.physical.toLocaleString()}</td>
    </tr>`;
  }).join('');

  document.getElementById('tableBody').innerHTML = `
    <table>
      <thead><tr>
        <th>Service</th>
        <th>Country ID</th>
        <th>Harga (IDR)</th>
        <th>Stok Virtual</th>
        <th>Stok Fisik</th>
      </tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="empty">Tidak ada hasil.</td></tr>'}</tbody>
    </table>`;

  renderPagination();
  renderSummary();
}

// ─── PAGINATION ──────────────────────────────────────────────────
function renderPagination() {
  const total = Math.ceil(filtered.length / PER_PAGE);
  const info = `<span class="page-info">${filtered.length.toLocaleString()} hasil · hal ${page}/${total}</span>`;

  if (total <= 1) {
    document.getElementById('pagination').innerHTML = info;
    return;
  }

  let btns = `<button class="page-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''}>‹</button>`;
  const from = Math.max(1, page-2), to = Math.min(total, page+2);
  if (from > 1) btns += `<button class="page-btn" onclick="goPage(1)">1</button><span class="page-info">...</span>`;
  for (let i = from; i <= to; i++) {
    btns += `<button class="page-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  if (to < total) btns += `<span class="page-info">...</span><button class="page-btn" onclick="goPage(${total})">${total}</button>`;
  btns += `<button class="page-btn" onclick="goPage(${page+1})" ${page===total?'disabled':''}>›</button>`;

  document.getElementById('pagination').innerHTML =
    `<div class="page-btns">${btns}</div>${info}`;
}

function goPage(p) {
  const total = Math.ceil(filtered.length / PER_PAGE);
  if (p < 1 || p > total) return;
  page = p;
  renderTable();
  window.scrollTo({top:0, behavior:'smooth'});
}

// ─── EXPORT CSV ──────────────────────────────────────────────────
function exportCSV() {
  if (!filtered.length) return;
  const header = 'Service,Country,Harga IDR,Stok Virtual,Stok Fisik\n';
  const rows = filtered.map(r =>
    `${r.service},${r.country},${r.price},${r.count},${r.physical}`
  ).join('\n');
  const blob = new Blob([header + rows], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `hero-sms-prices-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// ─── ERROR ───────────────────────────────────────────────────────
function showError(msg) {
  document.getElementById('errorArea').innerHTML = `<div class="error-box">⚠ ${msg}</div>`;
}
</script>
</body>
</html>
